# Databricks AI Runtime (serverless GPU) job spec: rebuild one moment of a clip with Pi3X. Submit with the AIR CLI:
#   air run --file job.yaml -p <profile>          (or: databricks air run --file job.yaml -p <profile>)
# Fill in the <...> placeholders. Inputs and outputs live on the bundle's volume (release/ and rebuilds/).
experiment_name: drone-swarm-4d-rebuild
mlflow_experiment_directory: <workspace-folder>/rebuild_jobs
mlflow_run_name: <run_name>
compute:
  accelerator_type: GPU_1xA10          # Pi3X on 2-3 views at 672x378 fits a 24 GB A10 in bf16
  num_accelerators: 1
environment:
  version: databricks_ai_v6            # ships torch, numpy, opencv; don't pin those again
code_source:
  type: snapshot
  snapshot:
    root_path: .
    include_paths: ["*.py", "*.sh", "job.yaml"]
command: "bash \"$CODE_SOURCE_PATH/entry.sh\" --release /Volumes/<catalog>/<schema>/release_files/release --clip clip1_three_drones --t 4.0 --out /Volumes/<catalog>/<schema>/release_files/rebuilds"
max_retries: 0
timeout_minutes: 30                    # always set; queue time before start is not billed
