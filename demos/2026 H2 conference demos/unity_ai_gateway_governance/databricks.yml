# Declarative Automation Bundle configuration for the AI Gateway Governance demo.
#
# Syncs the project to the authenticated Databricks workspace. After deploy,
# open ai_gateway_demo.ipynb under the bundle's workspace files and run the acts.
#
# Usage:
#   databricks bundle validate --profile <profile>
#   databricks bundle deploy --profile <profile>

bundle:
  name: unity-ai-gateway-governance

sync:
  exclude:
    - tests
    - uv.lock

targets:
  dev:
    mode: development
    default: true
